name: BAGEL-BE-CICD

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Java 설정
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Gradle Wrapper 실행권한 부여
        run: chmod +x gradlew

      - name: application-prod.yml 생성
        run: |
          mkdir -p src/main/resources
          cat << 'EOF' > ./src/main/resources/application-prod.yml
          ${{ secrets.APPLICATION_PROD_YML }}
          EOF

      # 테스트는 @ActiveProfiles("test") + H2로 운영 DB 없이 돌아가므로 더 이상 건너뛰지 않는다
      - name: Build with Gradle
        run: ./gradlew clean build -Dspring.profiles.active=prod

      - name: Docker 빌드환경 설정
        uses: docker/setup-buildx-action@v3

      - name: DockerHub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Docker 이미지 빌드 및 푸시
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/bagel-back-container:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Move Docker cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 2022
          script: |
            set -e

            echo "환경변수 설정.."
            export PATH=$PATH:/usr/local/bin
            export PW=${{ secrets.SERVER_PASSWORD }}
            PORT=8093
            CONTAINER_NAME="bagel-back"

            echo "컨테이너 이름: $CONTAINER_NAME"
            echo "포트: $PORT"

            echo "도커 이미지 풀 : ${{ secrets.DOCKERHUB_USERNAME }}/bagel-back-container:latest"
            echo $PW | sudo -S docker pull ${{ secrets.DOCKERHUB_USERNAME }}/bagel-back-container:latest

            echo "컨테이너 $CONTAINER_NAME 존재 여부 확인 중..."
            if sudo docker ps -a --format '{{.Names}}' | grep -Eq "^${CONTAINER_NAME}\$"; then
              echo "컨테이너 $CONTAINER_NAME 이(가) 존재합니다. 중지 및 삭제 중..."
              echo $PW | sudo -S docker rm -f $CONTAINER_NAME
              echo "컨테이너 $CONTAINER_NAME 이(가) 삭제되었습니다."
            else
              echo "존재하는 컨테이너 $CONTAINER_NAME 이(가) 없습니다."
            fi

            echo "새로운 컨테이너 $CONTAINER_NAME 실행 중..."
            # --restart unless-stopped: NAS 재부팅 시 컨테이너가 자동 복구되도록 보장
            # (미지정 시 restart policy가 no로 생성되어 재부팅 후 백엔드가 영구 정지됨)
            # 로그 레벨은 환경변수로 덮어쓴다.
            # application-prod.yml(=Actions 시크릿)이 web/security를 DEBUG로 두고 있어
            # 요청 1건당 15줄씩 찍혀 전체 로그의 60% 이상이 소음이었다.
            # 환경변수가 프로파일 설정보다 우선순위가 높아 시크릿을 건드리지 않고 교정할 수 있다.
            echo $PW | sudo -S docker run -d -p ${PORT}:8080 --name $CONTAINER_NAME \
              --restart unless-stopped \
              -e TZ=Asia/Seoul \
              -e "SPRING_PROFILES_ACTIVE=prod" \
              -e "LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB=INFO" \
              -e "LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY=INFO" \
              -v /etc/localtime:/etc/localtime:ro \
              ${{ secrets.DOCKERHUB_USERNAME }}/bagel-back-container:latest

            echo "배포가 성공적으로 완료되었습니다."

  # 파이프라인 실패를 자동으로 이슈화한다
  # 2025-11-05 빌드 실패가 알림 부재로 8개월간 방치되어 프로덕션이 중단된 사례가 있어 추가함
  notify-failure:
    needs: [build, deploy]
    # 스킵된 잡이 needs에 섞여도 확실히 실행되도록 always() + 결과 명시 비교를 쓴다
    if: always() && (needs.build.result == 'failure' || needs.deploy.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: 배포 실패 이슈 생성 또는 댓글 추가
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const title = '🚨 [배포실패] BAGEL-BE-CICD 파이프라인 실패';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const buildResult = '${{ needs.build.result }}';
            const deployResult = '${{ needs.deploy.result }}';
            const body = [
              `- **커밋**: ${context.sha}`,
              `- **브랜치**: \`${context.ref}\``,
              `- **build 잡**: ${buildResult}`,
              `- **deploy 잡**: ${deployResult}`,
              `- **실행 로그**: ${runUrl}`,
              '',
              '배포가 실패해 프로덕션에 반영되지 않았습니다.',
              '**주의**: 이 상태를 방치하면 서버 재시작 시 구버전으로 되돌아가거나 복구가 불가능해집니다.',
              '원인을 조치한 뒤 이 이슈를 닫아주세요.',
            ].join('\n');

            // 실패가 반복될 때 이슈가 계속 쌓이지 않도록 기존 열린 이슈에 댓글로 누적한다
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'bug',
              per_page: 100,
            });
            const duplicated = existing.data.find(issue => issue.title === title);

            if (duplicated) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: duplicated.number,
                body: `배포가 다시 실패했습니다.\n\n${body}`,
              });
              core.notice(`기존 이슈 #${duplicated.number}에 실패 내역을 추가했습니다.`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['bug'],
              });
              core.notice(`배포 실패 이슈 #${created.data.number}를 생성했습니다.`);
            }